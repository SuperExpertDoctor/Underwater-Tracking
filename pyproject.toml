# pyproject.toml
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "underwater-tracking"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "scipy>=1.14,<2",
  "shapely>=2.0,<3",
  "uvicorn>=0.34,<1",
  "exceptiongroup>=1.2,<2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6,<7",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "types-shapely>=2.0,<3",
]
audit = [
  "matplotlib>=3.9,<4",
  "imageio>=2.36,<3",
  "imageio-ffmpeg>=0.5,<1",
]
memory-local = ["sentence-transformers>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib -p no:launch_testing -p no:launch_ros --basetemp=.pytest_cache/tmp"
pythonpath = ["src", "."]
markers = [
  "real_llm: explicit real-provider test; requires UNDERWATER_TRACKING_RUN_REAL_LLM=1 and live credentials",
  "long_running: full-duration acceptance test; enable explicitly with UNDERWATER_TRACKING_RUN_8H=1",
  "live_acceptance: owned-process semantic acceptance; enable explicitly with UNDERWATER_TRACKING_RUN_LIVE_ACCEPTANCE=1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
