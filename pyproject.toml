# pyproject.toml
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "underwater-tracking"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["hypothesis>=6,<7", "mypy>=1.14,<2", "pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "real_llm: test hits the real LongCat API (skips when the API key env var is unset)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
