schema_version: world-model-rule-config-v1
enabled: true

# Four read-only prediction windows.  They cover the existing 1,800 s
# B-spline horizon and mirror the H1-H4 consequence interface used by the
# Sea-Air world-model project without importing or training that model.
horizons:
  - name: H1
    start_offset_s: 0.0
    end_offset_s: 120.0
  - name: H2
    start_offset_s: 120.0
    end_offset_s: 300.0
  - name: H3
    start_offset_s: 300.0
    end_offset_s: 900.0
  - name: H4
    start_offset_s: 900.0
    end_offset_s: 1800.0

thresholds:
  # IMM + B-spline target-motion rules.
  turn_model_probability_min: 0.45
  turn_heading_change_rad: 0.25
  turn_heading_change_strong_rad: 0.70
  sprint_speed_threshold_mps: 10.0
  sprint_reference_speed_mps: 14.0
  stop_speed_threshold_mps: 0.20
  stop_confirmation_s: 60.0

  # Future UUV coverage and bearings-only geometry rules.
  min_tracking_uuvs: 2
  low_energy_fraction: 0.10
  max_uuv_state_age_s: 30.0
  geometry_warning_od: 0.35
  geometry_critical_od: 0.15
  fim_rank_tolerance: 1.0e-12

  # Contact-association and combined track-loss rules.
  association_confidence_drop: 0.20
  association_entropy_rise: 0.20
  track_loss_corridor_m: 800.0
  track_loss_quality_threshold: 0.40
  event_min_confidence: 0.55
