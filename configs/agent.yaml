# Carrier assistant defaults, validated against AgentConfig.
# Loaded additively by load_app_config() when present next to tracking.yaml.

# Exponential-backoff retries for transport failures (timeout, rate limit,
# 5xx); 4xx configuration errors are never blindly retried.
transport_retries: 3

# Maximum schema/semantic error re-injection rounds for LLM outputs.
semantic_repairs: 2

# Quality thresholds must persist this long before a warning / critical
# event fires (spec 13): Q_EWMA < 0.65 for 2 minutes, Q_EWMA < 0.40 for
# 30 seconds.
quality_warning_persist_s: 120
quality_critical_persist_s: 30

# Coalescing window for duplicate events of the same entity/type (spec 8.2).
event_cooldown_s: 300

# Token estimate that triggers History compaction (spec 9).
history_token_threshold: 6000

# Runtime state limits keep long-running simulations bounded. Durable event
# logs remain complete; these values only limit in-process working sets.
retention:
  group_checkpoint_limit: 2
  belief_history_limit: 64
  event_history_limit: 2048
  mission_event_history_limit: 2048
  processed_event_limit: 4096
  payload_cache_limit: 64
  payload_db_limit: 256
  conversation_turn_limit: 128
  directive_job_limit: 256

# Intent-change confirmation gates (spec 8.2): leading confidence at least
# 0.70, leading the runner-up by at least 0.15, for two consecutive
# analyses.
intent_change_confirmation:
  confidence: 0.70
  margin: 0.15
  consecutive: 2

# Consecutive forecast-difference gate. Both trigger thresholds must be met;
# either lower threshold releases the latch.
trajectory_diff:
  normalized_threshold: 2.45
  absolute_floor_m: 250.0
  uncertainty_floor_m: 1.0
  near_term_decay_s: 600.0
  confirmation_cycles: 2
  reset_normalized_threshold: 1.75
  reset_absolute_floor_m: 150.0
  minimum_overlap_s: 300.0
  minimum_samples: 3
  schema_version: trajectory-diff-v1
