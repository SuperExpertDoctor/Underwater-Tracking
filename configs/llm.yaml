# Provider-neutral LLM client settings (spec 22, R1), validated against
# LLMConfig. Loaded additively by load_app_config() when present next to
# tracking.yaml.
#
# R1: the API key lives in configs/.env (git-ignored, never committed),
# resolved by load_app_config() into the environment; every client knob is
# explicit here. The environment variable api_key_env OVERRIDES the .env
# value when set (env wins); a missing env var falls back to the .env key.
model: "LongCat-2.0"
base_url: "https://api.longcat.chat/openai/v1"
api_key_env: "UNDERWATER_TRACKING_API_KEY"
temperature: 0.2
request_timeout_s: 180.0
connect_timeout_s: 10.0
max_tokens: 4096
max_retries: 3
backoff_base_s: 1.0
backoff_max_s: 60.0
roles:
  master:
    role: master
    model: "LongCat-2.0"
    base_url: "https://api.longcat.chat/openai/v1"
    temperature: 0.2
    request_timeout_s: 180.0
    connect_timeout_s: 10.0
    max_tokens: 4096
    max_retries: 3
    backoff_base_s: 1.0
    backoff_max_s: 60.0
    prompt_version: "master-v1"
  slave:
    role: slave
    model: "LongCat-2.0"
    base_url: "https://api.longcat.chat/openai/v1"
    temperature: 0.2
    request_timeout_s: 180.0
    connect_timeout_s: 10.0
    max_tokens: 4096
    max_retries: 3
    backoff_base_s: 1.0
    backoff_max_s: 60.0
    prompt_version: "slave-v1"
  adversary:
    role: adversary
    model: "LongCat-2.0"
    base_url: "https://api.longcat.chat/openai/v1"
    temperature: 0.2
    request_timeout_s: 180.0
    connect_timeout_s: 10.0
    max_tokens: 4096
    max_retries: 3
    backoff_base_s: 1.0
    backoff_max_s: 60.0
    prompt_version: "adversary-v1"
